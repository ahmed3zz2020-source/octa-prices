name: OCTA Interface CI — الجولة ٢٦ (بوابات حقيقية)

# OCTA-CI-GATES-V1 profile=frontend
#
# 📌 الملف ده بتاع **مستودع الواجهة** ⭐
#    ⇒ لازم يتنسخ على `.github/workflows/ci.yml` في مستودع الواجهة
#      (على فرع الـCI · عشان الدفع محتاج scope اسمه `workflow` ⭐).
#
# ⛔ قواعد الـCI (كلها متحقَّقة آلياً بـ tools/test_ci_gates.py):
#   ① `npm ci` = **بوابة صارمة**: لو فشل الـjob فشل وكل خطوة بعده
#      اتخطّت (مفيش continue-on-error · مفيش `|| true` · مفيش
#      `|| npm install` كبديل).
#   ② **كل** ملف اختبار موجود في المستودع بيشتغل (مفيش استبعاد
#      صامت · مفيش `--test-name-pattern` · مفيش حذف ملفات اختبار).
#   ③ ⛔ التصنيف **أربع حالات صريحة**: Passed · Failed · Skipped ·
#      Blocked ⭐ ⇒ والمتخطى (Skipped) **مش نجاح** ⭐ ⇒ بيتحسب
#      **فشل** في بوابة الـjob (كود خروج مخالف للصفر ⭐).
#      ⭐Blocked = الملف رجع صامت من غير ما يكمّل (زي absence مرجع
#      git في اختبارات البرهان السالب ⭐) ⇒ مش نجاح ⭐.
#   ④ ⛔ ⛔ **بناء النسخة النهائية** جوّه الـCI ⭐
#      (`npm run build:preview` · `npm run build:prod` ⭐).
#   ⑤ ⛔ **بوابة dist الحسّاسة**: مفيش `users.json` · مفيش
#      `data_markets.js` · مفيش `*.sqlite` · مفيش أي ملف أسرار
#      داخل نسخة الإنتاج ⭐ ⇒ وجودها = فشل ⭐.
#   ⑥ ⛔ كل نتيجة مربوطة ببصمة المرشح (OCTA_CANDIDATE_SHA) ⭐.
#   ⑦ مفيش أسرار · مفيش نشر · مفيش دفع · مفيش موارد مدفوعة.

on:
  # ⭐⭐⭐ (R32) ⭐⭐⭐ تشغيل على **فروع الاختبار فقط** ⭐⭐⭐ (زي الباك ⭐⭐⭐ بالظبط ⭐)
  # ⭐⭐⭐ (R32 · e) ⭐⭐⭐ المحفّز ⭐⭐⭐ = **فرع ⭐⭐⭐ الاختبار ⭐⭐⭐ المحدد ⭐⭐⭐ بس** ⭐⭐⭐
  # 📌 قبل ⭐: ⛔ `ci/**` ⭐ · `release/**` ⭐ · `review/**` ⭐ · `feature/**` ⭐ · `fix/**` ⭐
  #    ⭐ ⭐ ⇒ ⭐ ⭐ أي ⭐ ⭐ push ⭐ ⭐ على ⭐ ⭐ أي ⭐ ⭐ فرع ⭐ ⭐ كان ⭐ ⭐ بيشغّل ⭐ ⭐ الـCI ⭐ ⭐ ⭐.
  # ✅ دلوقتي ⭐: ⭐ **فرع واحد محدد** ⭐ ⭐ ⭐ = **`ci/octa-ci-r28-fe`** ⭐ ⭐ (فرع الاختبار ⭐⭐) ⭐⭐.
  push:
    branches:
      - 'ci/octa-ci-r28-fe'
  pull_request:
    branches:
      - main
      - 'ci/**'
      - 'release/**'
      - 'review/**'
  workflow_dispatch:

env:
  # ⛔ بصمة المرشح (الجولة ٢٦) — المصدر الواحد لكل النتائج ⭐
  #    (لازم يتحدّث لما المرشح يتغيّر ⭐)
  OCTA_CANDIDATE_SHA: '70ba5202ef3b1b7436fbdaad44b628ac36cee9cc'
  # ⭐⭐⭐ (R32) ⭐⭐⭐ بصمة **أدوات القياس** ⭐ ⭐⭐ (مثبّتة ⭐) ⭐
  OCTA_CI_TOOLS_SHA256: 'cc407ba0a5b84055afdfe9389498ab2518c9e7c6c82ead8f5baea5dd80621d67'

jobs:
  # ══════════════════════════════════════════════════════════════
  # ① البوابة الأولى: تثبيت الاعتماديات (صارم)
  # ══════════════════════════════════════════════════════════════
  dependency-install:
    name: "📦 ١) تثبيت الاعتماديات — بوابة صارمة"
    runs-on: ubuntu-latest
    steps:
      - name: "🧪 بوابة فرع الاختبار (تشغيل على main ⭐ ممنوع ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R32) ⭐⭐⭐ ⛔ التشغيل على **فرع الإنتاج** ⭐ ⭐ ⭐ ممنوع ⭐ ⭐ ⭐
          # 📌 السبب ⭐: ⛔ المحفّز ⭐ ⭐ ⭐ استثنى main ⭐ ⭐ ⭐ من الـpush ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ البوابة دي ⭐ ⭐ ⭐ **دفاع إضافي** ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ لو المحفّز اتغيّر ⭐ ⭐ ⭐ بعدين ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ الـrun ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ يوقف هنا ⭐ ⭐ ⭐ (مش يكمل ويقيس ⭐ ⭐ ⭐).
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"
          echo "event=$EVENT ⭐ ref=$REF ⭐"
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "FAIL: التشغيل على main ممنوع ⭐ — الفروع الاختبارية فقط ⭐"
            exit 1
          fi
          echo "PASS: الفروع الاختبارية فقط ⭐ (main ⭐ مش مسموح ⭐)"

      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R29 · FINDING-21) ⭐⭐⭐ ⭐ من **سطر الـworkflow** ⭐ ⭐
          # 📌 السبب ⭐: ⛔ `git rev-parse HEAD` ⭐ ⭐ **قبل** أي checkout ⭐ ⭐
          #    ⇒ ⛔ مافيش مستودع ⭐ ⭐ ⇒ ⛔ الأمر بيرجع خطأ ⭐ ⭐ ⇒ ⛔ الـjob بيفشل ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ `github.workflow_sha` ⭐ ⭐ = ⭐ commit ملف الـworkflow ⭐ ⭐
          #    ⇒ ⭐ ⭐ متاح **من غير** أي checkout ⭐ ⭐ ⇒ ⭐ ⭐ صح ⭐ ⭐.
          echo "ci_def_sha=${{ github.workflow_sha }}" >> "$GITHUB_ENV"
          echo "CI definition SHA = ${{ github.workflow_sha }}"
          echo "candidate_sha=${OCTA_CANDIDATE_SHA}"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

      - name: "🧰 استرجاع أدوات الـCI من فرع الـCI ⭐ (FINDING-21 ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R29 · FINDING-21) ⭐⭐⭐ ⭐⭐
          # 📌 السبب ⭐: ⛔ الـcheckout **المثبّت** ⭐ على SHA المرشّح ⭐ ⭐
          #    ⭐ بيمسح أدوات الـCI ⭐ ⭐ (هي على فرع الـCI ⭐ ⭐ مش على المرشح ⭐ ⭐)
          #    ⇒ ⛔ كل خطوة بتستدعي أداة CI ⭐ ⭐ بتفشل ⭐ ⭐ بـ«file not found» ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ نسترجع أدوات الـCI ⭐ ⭐ من فرع الـCI ⭐ ⭐
          #    ⇒ ⭐ ⭐ الـCI يشتغل ⭐ ⭐ **و** ⭐ ⭐ الكود المقيس ⭐ ⭐ = المرشح ⭐ ⭐ بالضبط ⭐ ⭐.
          CI_REF="${OCTA_CI_REF:-ci/octa-ci-r28-fe}"
          git fetch --no-tags --depth=1 origin "$CI_REF"
          git checkout FETCH_HEAD -- \
            tools/ci_isolated_tests.json \
            tools/ci_result_classifier.py \
            tools/ci_workflow_lint.py \
            tools/test_ci_alt_gates.py \
            tools/test_ci_gates.py \
            tools/test_ci_result_classifier.py
          echo "✅ أدوات الـCI اترجعت ⭐ (المرشح لسه هو الكود المقيس ⭐)"
          # ⭐⭐⭐ (R32) ⭐⭐⭐ بوابة **بصمة أدوات القياس** ⭐ ⭐⭐
          # 📌 الصيغة ⭐ ⭐ ⭐ ( GNU coreutils ⭐ ⭐ ⭐): المسار ⭐ ⭐ ⭐ + بايت واحد ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ + sha256 ⭐ ⭐ ⭐ للملف ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس السطر ⭐ ⭐ ⭐ يتحسب محلياً ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ (tools/ci_digest_check.sh ⭐ ⭐ ⭐) ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس القيمة ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ برهان ⭐ ⭐ ⭐.
          DIGEST="$(for f in tools/ci_isolated_tests.json tools/ci_result_classifier.py tools/ci_workflow_lint.py tools/test_ci_alt_gates.py tools/test_ci_gates.py tools/test_ci_result_classifier.py; do printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1; done | sha256sum | cut -d' ' -f1)"
          if [ "$DIGEST" != "$OCTA_CI_TOOLS_SHA256" ]; then
            echo "FAIL: أدوات القياس المثبّتة اتغيّرت ⭐ ($DIGEST ⭐ ≠ ⭐ $OCTA_CI_TOOLS_SHA256 ⭐)"
            exit 1
          fi
          echo "✅ بصمة أدوات القياس مطابقة ⭐ ($DIGEST ⭐)"

      - name: "🔒 بوابة بصمة المرشح (merge-base --is-ancestor ⭐)"
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "ci_def_sha=${ci_def_sha:-unknown}"
          echo "candidate_sha=$OCTA_CANDIDATE_SHA"
          echo "fe_sha=$OCTA_CANDIDATE_SHA"
          echo "tested_head=$ACTUAL"
          # ⭐⭐⭐ (R29 · FINDING-18) ⭐⭐⭐ مطابقة **بالضبط** ⭐⭐⭐
          # 📌 السبب ⭐: ⛔ «سلف» ⭐ (ancestor ⭐) ⭐ بتسمح بأي commit أحدث ⭐
          #    ⇒ ⛔ الكود المقيس ممكن **مش** المرشح ⭐ ⇒ ⛔ كذب ⭐.
          # ✅ دلوقتي ⭐: ⛔ الـcheckout **مثبّت** ⭐ على SHA المرشّح ⭐
          #    ⇒ ⛔ لازم يطابق **بالضبط** ⭐ (من غيره ⇒ فشل ⭐).
          if [ "$ACTUAL" != "$OCTA_CANDIDATE_SHA" ]; then
            echo "FAIL: الـSHA المختبَر ($ACTUAL) ⭐ مش المرشح المطلوب ($OCTA_CANDIDATE_SHA)"
            exit 1
          fi
          echo "PASS: الـSHA المختبَر = المرشح بالضبط ⭐"

      - name: "🔒 البوابة الكاملة (نطاق الفرق = ملفات الـCI بس)"
        run: |
          set -euo pipefail
          UNEXPECTED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*|ci-workflow/*|tools/test_ci_*|tools/ci_*|tools/copy-data.js) ;;
              *) UNEXPECTED="$UNEXPECTED$f " ;;
            esac
          done <<< "$(git diff --name-only "$OCTA_CANDIDATE_SHA" "$ACTUAL")"
          if [ -n "$UNEXPECTED" ]; then
            echo "⛔ ملفات خارج نطاق الـCI اتغيّرت عن المرشح:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "PASS: الشجرة المختبَرة = المرشح + ملفات الـCI بس"

      - name: "🟢 تجهيز Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 npm ci (فشل التثبيت ⇒ فشل الـjob)"
        run: |
          set -euo pipefail
          echo "📦 تثبيت الاعتماديات من package-lock.json…"
          npm ci --no-audit --no-fund
          echo "✅ التثبيت خلص بنجاح"

      - name: "🔬 تحقّق إن التثبيت تمّ فعلاً (npm ls)"
        run: |
          set -euo pipefail
          npm ls --depth=0
          node --version
          npm --version

      - name: "🛡️ حارس الـCI (لازم ملف الـCI نفسه نضيف)"
        run: python3 tools/test_ci_gates.py

  # ══════════════════════════════════════════════════════════════
  # ② كل اختبارات الواجهة (كل ملف موجود — بلا استبعاد صامت)
  # ══════════════════════════════════════════════════════════════
  frontend-suite:
    name: "🧪 ٢) اختبارات الواجهة — كل الملفات (تصنيف أربع حالات ⭐)"
    needs: dependency-install
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R29 · FINDING-21) ⭐⭐⭐ ⭐ من **سطر الـworkflow** ⭐ ⭐
          # 📌 السبب ⭐: ⛔ `git rev-parse HEAD` ⭐ ⭐ **قبل** أي checkout ⭐ ⭐
          #    ⇒ ⛔ مافيش مستودع ⭐ ⭐ ⇒ ⛔ الأمر بيرجع خطأ ⭐ ⭐ ⇒ ⛔ الـjob بيفشل ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ `github.workflow_sha` ⭐ ⭐ = ⭐ commit ملف الـworkflow ⭐ ⭐
          #    ⇒ ⭐ ⭐ متاح **من غير** أي checkout ⭐ ⭐ ⇒ ⭐ ⭐ صح ⭐ ⭐.
          echo "ci_def_sha=${{ github.workflow_sha }}" >> "$GITHUB_ENV"
          echo "CI definition SHA = ${{ github.workflow_sha }}"
          echo "candidate_sha=${OCTA_CANDIDATE_SHA}"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

      - name: "🧰 استرجاع أدوات الـCI من فرع الـCI ⭐ (FINDING-21 ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R29 · FINDING-21) ⭐⭐⭐ ⭐⭐
          # 📌 السبب ⭐: ⛔ الـcheckout **المثبّت** ⭐ على SHA المرشّح ⭐ ⭐
          #    ⭐ بيمسح أدوات الـCI ⭐ ⭐ (هي على فرع الـCI ⭐ ⭐ مش على المرشح ⭐ ⭐)
          #    ⇒ ⛔ كل خطوة بتستدعي أداة CI ⭐ ⭐ بتفشل ⭐ ⭐ بـ«file not found» ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ نسترجع أدوات الـCI ⭐ ⭐ من فرع الـCI ⭐ ⭐
          #    ⇒ ⭐ ⭐ الـCI يشتغل ⭐ ⭐ **و** ⭐ ⭐ الكود المقيس ⭐ ⭐ = المرشح ⭐ ⭐ بالضبط ⭐ ⭐.
          CI_REF="${OCTA_CI_REF:-ci/octa-ci-r28-fe}"
          git fetch --no-tags --depth=1 origin "$CI_REF"
          git checkout FETCH_HEAD -- \
            tools/ci_isolated_tests.json \
            tools/ci_result_classifier.py \
            tools/ci_workflow_lint.py \
            tools/test_ci_alt_gates.py \
            tools/test_ci_gates.py \
            tools/test_ci_result_classifier.py
          echo "✅ أدوات الـCI اترجعت ⭐ (المرشح لسه هو الكود المقيس ⭐)"
          # ⭐⭐⭐ (R32) ⭐⭐⭐ بوابة **بصمة أدوات القياس** ⭐ ⭐⭐
          # 📌 الصيغة ⭐ ⭐ ⭐ ( GNU coreutils ⭐ ⭐ ⭐): المسار ⭐ ⭐ ⭐ + بايت واحد ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ + sha256 ⭐ ⭐ ⭐ للملف ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس السطر ⭐ ⭐ ⭐ يتحسب محلياً ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ (tools/ci_digest_check.sh ⭐ ⭐ ⭐) ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس القيمة ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ برهان ⭐ ⭐ ⭐.
          DIGEST="$(for f in tools/ci_isolated_tests.json tools/ci_result_classifier.py tools/ci_workflow_lint.py tools/test_ci_alt_gates.py tools/test_ci_gates.py tools/test_ci_result_classifier.py; do printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1; done | sha256sum | cut -d' ' -f1)"
          if [ "$DIGEST" != "$OCTA_CI_TOOLS_SHA256" ]; then
            echo "FAIL: أدوات القياس المثبّتة اتغيّرت ⭐ ($DIGEST ⭐ ≠ ⭐ $OCTA_CI_TOOLS_SHA256 ⭐)"
            exit 1
          fi
          echo "✅ بصمة أدوات القياس مطابقة ⭐ ($DIGEST ⭐)"

      - name: "🔒 بوابة بصمة المرشح (merge-base --is-ancestor ⭐)"
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "ci_def_sha=${ci_def_sha:-unknown}"
          echo "candidate_sha=$OCTA_CANDIDATE_SHA"
          echo "fe_sha=$OCTA_CANDIDATE_SHA"
          echo "tested_head=$ACTUAL"
          # ⭐⭐⭐ (R29 · FINDING-18) ⭐⭐⭐ مطابقة **بالضبط** ⭐⭐⭐
          # 📌 السبب ⭐: ⛔ «سلف» ⭐ (ancestor ⭐) ⭐ بتسمح بأي commit أحدث ⭐
          #    ⇒ ⛔ الكود المقيس ممكن **مش** المرشح ⭐ ⇒ ⛔ كذب ⭐.
          # ✅ دلوقتي ⭐: ⛔ الـcheckout **مثبّت** ⭐ على SHA المرشّح ⭐
          #    ⇒ ⛔ لازم يطابق **بالضبط** ⭐ (من غيره ⇒ فشل ⭐).
          if [ "$ACTUAL" != "$OCTA_CANDIDATE_SHA" ]; then
            echo "FAIL: الـSHA المختبَر ($ACTUAL) ⭐ مش المرشح المطلوب ($OCTA_CANDIDATE_SHA)"
            exit 1
          fi
          echo "PASS: الـSHA المختبَر = المرشح بالضبط ⭐"

      - name: "🔒 البوابة الكاملة (نطاق الفرق = ملفات الـCI بس)"
        run: |
          set -euo pipefail
          UNEXPECTED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*|ci-workflow/*|tools/test_ci_*|tools/ci_*|tools/copy-data.js) ;;
              *) UNEXPECTED="$UNEXPECTED$f " ;;
            esac
          done <<< "$(git diff --name-only "$OCTA_CANDIDATE_SHA" "$ACTUAL")"
          if [ -n "$UNEXPECTED" ]; then
            echo "⛔ ملفات خارج نطاق الـCI اتغيّرت عن المرشح:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "PASS: الشجرة المختبَرة = المرشح + ملفات الـCI بس"

      - name: "🟢 تجهيز Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 npm ci (بوابة صارمة)"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: "🧪 تنفيذ الاختبارات الحقيقية (node --test assets/tests/*.test.js ⭐)"
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/octa-fe-results"
          mkdir -p "$OUT_DIR"
          : > "$OUT_DIR/summary.jsonl"
          TOTAL=0
          PASSED=0
          FAILEDN=0
          SKIPPEDN=0
          BLOCKEDN=0
          for f in assets/tests/*.test.js; do
            NAME="$(basename "$f")"
            LOG="$OUT_DIR/$NAME.log"
            if node --test "$f" > "$LOG" 2>&1; then
              RC=0
            else
              RC=$?
            fi
            PASS="$(awk '/^# pass /{print $3; exit}' "$LOG")"
            FAILC="$(awk '/^# fail /{print $3; exit}' "$LOG")"
            SKIPC="$(awk '/^# skipped /{print $3; exit}' "$LOG")"
            TODOC="$(awk '/^# todo /{print $3; exit}' "$LOG")"
            TESTS="$(awk '/^# tests /{print $3; exit}' "$LOG")"
            PASS="${PASS:-0}"
            FAILC="${FAILC:-0}"
            SKIPC="${SKIPC:-0}"
            TODOC="${TODOC:-0}"
            TESTS="${TESTS:-0}"
            EXECUTED=$((PASS + FAILC))
            DECLARED="$(awk '/^[[:space:]]*(test|it)\(/ {c++} END {print c+0}' "$f")"
            # ⛔⛔⛔ بوابة مراجع git ⭐ (R26) ⭐
            #    اختبارات البرهان السالب بتعتمد على **مرجع git** ⭐
            #    ⇒ لو المرجع مش موجود ⭐ الاختبار بيرجع **صامت** ⭐
            #    ⇒ الغياب لازم يبقى نتيجة **موثّقة** (blocked) ⭐
            #       مش نجاح صامت ⭐
            MISSING_REF=""
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
                MISSING_REF="$MISSING_REF $ref"
              fi
            done < <(awk '
              {
                line = $0
                low = tolower(line)
                n = split("show cat-file rev-parse merge-base diff checkout", verbs, " ")
                for (i = 1; i <= n; i++) {
                  p = index(low, verbs[i])
                  if (p > 0) {
                    rest = substr(line, p + length(verbs[i]))
                    if (match(rest, /[0-9a-f]{7,40}/)) {
                      print substr(rest, RSTART, RLENGTH)
                    }
                  }
                }
              }
            ' "$f" | sort -u)
            if [ "$RC" -ne 0 ] || [ "$FAILC" -gt 0 ]; then
              STATUS=failed
              FAILEDN=$((FAILEDN + 1))
            elif [ -n "$MISSING_REF" ]; then
              STATUS=blocked
              BLOCKEDN=$((BLOCKEDN + 1))
            elif [ "$SKIPC" -gt 0 ] || [ "$TODOC" -gt 0 ]; then
              STATUS=skipped
              SKIPPEDN=$((SKIPPEDN + 1))
            elif [ "$DECLARED" -gt 0 ] && [ "$EXECUTED" -lt "$DECLARED" ]; then
              STATUS=blocked
              BLOCKEDN=$((BLOCKEDN + 1))
            elif [ "$EXECUTED" -eq 0 ]; then
              STATUS=blocked
              BLOCKEDN=$((BLOCKEDN + 1))
            else
              STATUS=passed
              PASSED=$((PASSED + 1))
            fi
            TOTAL=$((TOTAL + 1))
            printf '{"file":"%s","status":"%s","rc":%s,"declared":%s,"executed":%s,"pass":%s,"fail":%s,"skipped":%s}\n' \
              "$NAME" "$STATUS" "$RC" "$DECLARED" "$EXECUTED" "$PASS" "$FAILC" \
              "$((SKIPC + TODOC))" >> "$OUT_DIR/summary.jsonl"
            echo "$NAME · $STATUS · rc=$RC · declared=$DECLARED · executed=$EXECUTED"
          done
          echo ""
          echo "📊 اختبارات الواجهة: $TOTAL ملف · $PASSED نجح · $FAILEDN فشل · $SKIPPEDN متخطى · $BLOCKEDN محجوب"
          if [ "$TOTAL" -eq 0 ]; then
            echo "⛔ مفيش أي ملف اختبار اتنفّذ"
            exit 1
          fi
          if [ "$TOTAL" -ne "$PASSED" ]; then
            echo "⛔⛔⛔ فيه ملفات مش ناجحة ⭐ ⇒ المتخطى (Skipped) مش نجاح ⭐ ⇒ الـjob بيفشل ⭐"
            exit 1
          fi
          echo "✅ كل اختبارات الواجهة عدّت"

  # ══════════════════════════════════════════════════════════════
  # ③ حُرّاس المستودع (نظافة النص · XSS · تعريف الـCI · YAML)
  # ══════════════════════════════════════════════════════════════
  hygiene-guards:
    name: "🧹 ٣) حُرّاس المستودع — نظافة النص + XSS + تعريف الـCI + YAML ⭐"
    needs: frontend-suite
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R29 · FINDING-21) ⭐⭐⭐ ⭐ من **سطر الـworkflow** ⭐ ⭐
          # 📌 السبب ⭐: ⛔ `git rev-parse HEAD` ⭐ ⭐ **قبل** أي checkout ⭐ ⭐
          #    ⇒ ⛔ مافيش مستودع ⭐ ⭐ ⇒ ⛔ الأمر بيرجع خطأ ⭐ ⭐ ⇒ ⛔ الـjob بيفشل ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ `github.workflow_sha` ⭐ ⭐ = ⭐ commit ملف الـworkflow ⭐ ⭐
          #    ⇒ ⭐ ⭐ متاح **من غير** أي checkout ⭐ ⭐ ⇒ ⭐ ⭐ صح ⭐ ⭐.
          echo "ci_def_sha=${{ github.workflow_sha }}" >> "$GITHUB_ENV"
          echo "CI definition SHA = ${{ github.workflow_sha }}"
          echo "candidate_sha=${OCTA_CANDIDATE_SHA}"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

      - name: "🧰 استرجاع أدوات الـCI من فرع الـCI ⭐ (FINDING-21 ⭐)"
        run: |
          set -euo pipefail
          # ⭐⭐⭐ (R29 · FINDING-21) ⭐⭐⭐ ⭐⭐
          # 📌 السبب ⭐: ⛔ الـcheckout **المثبّت** ⭐ على SHA المرشّح ⭐ ⭐
          #    ⭐ بيمسح أدوات الـCI ⭐ ⭐ (هي على فرع الـCI ⭐ ⭐ مش على المرشح ⭐ ⭐)
          #    ⇒ ⛔ كل خطوة بتستدعي أداة CI ⭐ ⭐ بتفشل ⭐ ⭐ بـ«file not found» ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ نسترجع أدوات الـCI ⭐ ⭐ من فرع الـCI ⭐ ⭐
          #    ⇒ ⭐ ⭐ الـCI يشتغل ⭐ ⭐ **و** ⭐ ⭐ الكود المقيس ⭐ ⭐ = المرشح ⭐ ⭐ بالضبط ⭐ ⭐.
          CI_REF="${OCTA_CI_REF:-ci/octa-ci-r28-fe}"
          git fetch --no-tags --depth=1 origin "$CI_REF"
          git checkout FETCH_HEAD -- \
            tools/ci_isolated_tests.json \
            tools/ci_result_classifier.py \
            tools/ci_workflow_lint.py \
            tools/test_ci_alt_gates.py \
            tools/test_ci_gates.py \
            tools/test_ci_result_classifier.py
          echo "✅ أدوات الـCI اترجعت ⭐ (المرشح لسه هو الكود المقيس ⭐)"
          # ⭐⭐⭐ (R32) ⭐⭐⭐ بوابة **بصمة أدوات القياس** ⭐ ⭐⭐
          # 📌 الصيغة ⭐ ⭐ ⭐ ( GNU coreutils ⭐ ⭐ ⭐): المسار ⭐ ⭐ ⭐ + بايت واحد ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ + sha256 ⭐ ⭐ ⭐ للملف ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس السطر ⭐ ⭐ ⭐ يتحسب محلياً ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ (tools/ci_digest_check.sh ⭐ ⭐ ⭐) ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس القيمة ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ برهان ⭐ ⭐ ⭐.
          DIGEST="$(for f in tools/ci_isolated_tests.json tools/ci_result_classifier.py tools/ci_workflow_lint.py tools/test_ci_alt_gates.py tools/test_ci_gates.py tools/test_ci_result_classifier.py; do printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1; done | sha256sum | cut -d' ' -f1)"
          if [ "$DIGEST" != "$OCTA_CI_TOOLS_SHA256" ]; then
            echo "FAIL: أدوات القياس المثبّتة اتغيّرت ⭐ ($DIGEST ⭐ ≠ ⭐ $OCTA_CI_TOOLS_SHA256 ⭐)"
            exit 1
          fi
          echo "✅ بصمة أدوات القياس مطابقة ⭐ ($DIGEST ⭐)"

      - name: "🔒 بوابة بصمة المرشح (merge-base --is-ancestor ⭐)"
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "ci_def_sha=${ci_def_sha:-unknown}"
          echo "candidate_sha=$OCTA_CANDIDATE_SHA"
          echo "fe_sha=$OCTA_CANDIDATE_SHA"
          echo "tested_head=$ACTUAL"
          # ⭐⭐⭐ (R29 · FINDING-18) ⭐⭐⭐ مطابقة **بالضبط** ⭐⭐⭐
          # 📌 السبب ⭐: ⛔ «سلف» ⭐ (ancestor ⭐) ⭐ بتسمح بأي commit أحدث ⭐
          #    ⇒ ⛔ الكود المقيس ممكن **مش** المرشح ⭐ ⇒ ⛔ كذب ⭐.
          # ✅ دلوقتي ⭐: ⛔ الـcheckout **مثبّت** ⭐ على SHA المرشّح ⭐
          #    ⇒ ⛔ لازم يطابق **بالضبط** ⭐ (من غيره ⇒ فشل ⭐).
          if [ "$ACTUAL" != "$OCTA_CANDIDATE_SHA" ]; then
            echo "FAIL: الـSHA المختبَر ($ACTUAL) ⭐ مش المرشح المطلوب ($OCTA_CANDIDATE_SHA)"
            exit 1
          fi
          echo "PASS: الـSHA المختبَر = المرشح بالضبط ⭐"

      - name: "🟢 تجهيز Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "📦 npm ci (بوابة صارمة)"
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: "🧰 تجهيز مدقّق YAML (PyYAML في بيئة معزولة ⭐)"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/octa-lint"
          "$RUNNER_TEMP/octa-lint/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir pyyaml
          echo "✅ مدقّق YAML جاهز"

      - name: "📐 فحص صحّة YAML لكل ملف workflow (yaml.safe_load ⭐)"
        run: |
          set -euo pipefail
          COUNT=0
          for f in .github/workflows/*.yml; do
            "$RUNNER_TEMP/octa-lint/bin/python" -c \
              "import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding='utf-8')); print('YAML OK: ' + sys.argv[1])" \
              "$f"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "⛔ مفيش أي ملف workflow اتفحص"
            exit 1
          fi
          echo "✅ اتفحص $COUNT ملف workflow"

      - name: "🔍 فحص تعريف الـActions (actionlint · أو البديل الأدق ⭐)"
        run: |
          set -euo pipefail
          if command -v actionlint >/dev/null 2>&1; then
            echo "🔍 actionlint متاح — بنشغّله"
            actionlint .github/workflows/*.yml
          else
            echo "ℹ️ actionlint مش متاح — بنشغّل حارس الـCI (فحص تعريف الملف ⭐)"
            python3 tools/test_ci_gates.py
          fi

      - name: "📤 حارس نظافة النص (حروف تالفة / أسماء أدوات)"
        run: node tools/check-text-hygiene.js

      - name: "🛡️ جرد XSS + التصنيف"
        run: node tools/xss-inventory.js --triage ci-xss-triage.md

      - name: "🛡️ حارس بوّابات الـCI (tools/test_ci_gates.py)"
        run: python3 tools/test_ci_gates.py

      - name: "🧪 🛡️ الملفات المعزولة — بوابة بديلة إلزامية ⭐ (مافيش استبداء صامت ⭐)"
        run: |
          set -euo pipefail
          # ⛔⛔ الملفات المعزولة ⭐ بيحتاجوا مصنكة ⭐ ولا تقنيات النتاج ⭐
          # ⇒ لكل ملف معزول ⭐ ليه بوابة بديلة إلزامية تشغل جوه المعاينة ⭐
          python3 tools/ci_result_classifier.py run \
            --kind node --root . --out "$RUNNER_TEMP/fe-isolated.json" \
            --timeout 900 \
            --pattern "mgmt/test_live.py" \
            --pattern "mgmt/tests/test_panel_e2e.py" \
            --pattern "test-screener-merge.mjs" \
            --pattern "test_gold_savings_ui.py" \
            --pattern "tools/test-data-routing.js" \
            --pattern "tools/test-halan-news.js" \
            --pattern "tools/test-index-ui.js" \
            --pattern "tools/test-news-axis-page.py" \
            --pattern "tools/test-news-axis-paths.py" \
            --pattern "tools/test-news-axis-visual.py" \
            --pattern "tools/test-usd-ui.js" \
            --pattern "tools/test_gauge.py" \
            --pattern "tools/test_intel_modal.py" \
            --pattern "tools/test_preview_isolation.py" \
            --pattern "tools/test_webapk_update.py" \
          python3 - <<'PY'
          import json, os, sys
          doc = json.load(open(os.environ["RUNNER_TEMP"] + "/fe-isolated.json",
                               encoding="utf-8"))
          files = doc.get("files", [])
          bad = [r for r in files if r.get("status") != "passed"]
          for r in files:
              print("📄 %s ⇒ %s ⭐ (%s)" % (r.get("file"),
                                              r.get("status"),
                                              r.get("reason", "")))
          if bad:
              print("⛔⛔⛔ ملفات معزولة لا عدات بوابة بديلة ⭐")
              sys.exit(1)
          print("✅ كل الملفات المعزولة عدت عبر البوابات البديلة ⭐")
          PY

  # ══════════════════════════════════════════════════════════════
  # ④ البناء النهائي + بوابة dist الحسّاسة
  # ══════════════════════════════════════════════════════════════
  build-gate:
    name: "🏗️ ٤) البناء النهائي (preview + prod) + بوابة dist ⭐"
    needs: hygiene-guards
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
