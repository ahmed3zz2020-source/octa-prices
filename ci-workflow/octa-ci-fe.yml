          #    ⭐ بيمسح أدوات الـCI ⭐ ⭐ (هي على فرع الـCI ⭐ ⭐ مش على المرشح ⭐ ⭐)
          #    ⇒ ⛔ كل خطوة بتستدعي أداة CI ⭐ ⭐ بتفشل ⭐ ⭐ بـ«file not found» ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ نسترجع أدوات الـCI ⭐ ⭐ من فرع الـCI ⭐ ⭐
          #    ⇒ ⭐ ⭐ الـCI يشتغل ⭐ ⭐ **و** ⭐ ⭐ الكود المقيس ⭐ ⭐ = المرشح ⭐ ⭐ بالضبط ⭐ ⭐.
          CI_REF="${OCTA_CI_REF:-ci/octa-ci-r28-fe}"
          git fetch --no-tags --depth=1 origin "$CI_REF"
          git checkout FETCH_HEAD -- \
            tools/ci_isolated_tests.json \
            tools/ci_result_classifier.py \
            tools/ci_workflow_lint.py \
            tools/test_ci_alt_gates.py \
            tools/test_ci_gates.py \
            tools/test_ci_result_classifier.py
          echo "✅ أدوات الـCI اترجعت ⭐ (المرشح لسه هو الكود المقيس ⭐)"
          # ⭐⭐⭐ (R32) ⭐⭐⭐ بوابة **بصمة أدوات القياس** ⭐ ⭐⭐
          # 📌 الصيغة ⭐ ⭐ ⭐ ( GNU coreutils ⭐ ⭐ ⭐): المسار ⭐ ⭐ ⭐ + بايت واحد ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ + sha256 ⭐ ⭐ ⭐ للملف ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس السطر ⭐ ⭐ ⭐ يتحسب محلياً ⭐ ⭐ ⭐
          #    ⭐ ⭐ ⭐ (tools/ci_digest_check.sh ⭐ ⭐ ⭐) ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ نفس القيمة ⭐ ⭐ ⭐ ⇒ ⭐ ⭐ ⭐ برهان ⭐ ⭐ ⭐.
          DIGEST="$(for f in tools/ci_isolated_tests.json tools/ci_result_classifier.py tools/ci_workflow_lint.py tools/test_ci_alt_gates.py tools/test_ci_gates.py tools/test_ci_result_classifier.py; do printf '%s ' "$f"; sha256sum "$f" | cut -d' ' -f1; done | sha256sum | cut -d' ' -f1)"
          if [ "$DIGEST" != "$OCTA_CI_TOOLS_SHA256" ]; then
