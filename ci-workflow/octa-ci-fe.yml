          #    ⇒ ⛔ مافيش مستودع ⭐ ⭐ ⇒ ⛔ الأمر بيرجع خطأ ⭐ ⭐ ⇒ ⛔ الـjob بيفشل ⭐ ⭐.
          # ✅ دلوقتي ⭐: ⭐ `github.workflow_sha` ⭐ ⭐ = ⭐ commit ملف الـworkflow ⭐ ⭐
          #    ⇒ ⭐ ⭐ متاح **من غير** أي checkout ⭐ ⭐ ⇒ ⭐ ⭐ صح ⭐ ⭐.
          echo "ci_def_sha=${{ github.workflow_sha }}" >> "$GITHUB_ENV"
          echo "CI definition SHA = ${{ github.workflow_sha }}"
          echo "candidate_sha=${OCTA_CANDIDATE_SHA}"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
