      - name: "🚧 بوابة الملفات الحسّاسة (dist + الشجرة كلها ⭐)"
        run: |
          set -euo pipefail
          BAD=0
          scan_dir() {
            DIR="$1"
            [ -d "$DIR" ] || return 0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "⛔ ملف حسّاس موجود: $f"
              BAD=1
            done < <(find "$DIR" \
              \( -name '.git' -o -name 'node_modules' -o -name '__pycache__' \) -prune -o \
              \( -type f \( -name 'users.json' -o -name 'data_markets.js' \
                 -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \
                 -o -name '.env' -o -name '*.env' -o -name '*.pem' \
                 -o -name '*.key' -o -iname '*secret*' \) \) -print)
          }
          scan_dir "."
          scan_dir "dist"
          if [ "$BAD" -ne 0 ]; then
            echo "⛔⛔⛔ ملفات حسّاسة في نسخة الإنتاج ⭐ ⇒ الـjob بيفشل ⭐"
            exit 1
          fi
          echo "✅ مفيش أي ملف حسّاس في الشجرة ولا في dist ⭐"
