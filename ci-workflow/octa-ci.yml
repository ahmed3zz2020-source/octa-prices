  # ══════════════════════════════════════════════════════════════
  release-gate:
    name: "🚧 ٧) بوابة الملفات الحسّاسة (نسخة الإنتاج)"
    needs: data-integrity
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
