name: OCTA CI — الجولة ٢٦ (بوابات حقيقية)

# OCTA-CI-GATES-V1 profile=backend
#
# 📌 ليه الملف ده على فرع الـCI ومش على فرع الكود؟
#    ⇒ GitHub بيرفض تحديث أي ملف تحت `.github/workflows/` لو التوكن
#      مالوش scope اسمه `workflow`.
#    ⇒ فرع الـCI هو المكان الصح للـCI الحقيقي، ويننشر بتوكن
#      عنده scope `workflow`.
#    ⇒ نسخة النشر (نفس المحتوى ⭐) في `ci-workflow/octa-ci.yml` ⭐
#      وهي اللي بتتنشر على فرع الـCI ⭐.
#    ⭐ والأهم ⭐: الملف ده هو اللي الحارس بيفحصه ⭐
#      (`python3 tools/test_ci_gates.py .github/workflows/ci.yml` ⭐)
#      ⇒ لازم يبقى نضيف ⭐ (مش نسخة main ⭐).
#
# ⛔ قواعد الـCI (كلها متحقَّقة آلياً بـ tools/test_ci_gates.py):
#   ① `pip install -r requirements.txt` = **بوابة صارمة**: لو فشل
#      الـjob فشل وكل خطوة بعده اتخطّت (مفيش continue-on-error،
#      مفيش `|| true`، مفيش `|| echo`).
#   ② **كل** ملف اختبار موجود في المستودع بيشتغل (مفيش استبعاد
#      صامت) — وأي ملف مش قادر يشتغل في الـCI ليه **بوابة بديلة
#      إلزامية** بتشتغل جواه نفس الـjob (من ملف السجل
#      tools/ci_isolated_tests.json).
#   ③ ⛔ التصنيف **أربع حالات صريحة**: Passed · Failed · Skipped ·
#      Blocked ⭐ ⇒ والمتخطى (Skipped) **مش نجاح** ⭐ ⇒ ويتحسب
#      **فشل** في بوابة الـjob (كود خروج مخالف للصفر ⭐).
#   ④ ⛔ كل نتيجة مربوطة ببصمة المرشح (OCTA_CANDIDATE_SHA) ⭐
#      ⇒ الـSHA المختبَر لازم يكون من عائلة المرشح ⭐.
#   ⑤ ⛔ مفيش ملف حسّاس (users.json · data_markets.js · *.sqlite ·
#      ملفات الأسرار) يدخل نسخة الإنتاج ⭐.
#   ⑥ ⛔ تعريف ملف الـworkflow نفسه بيتفحص (YAML + مدقّق Actions) ⭐.
#   ⑦ مفيش أسرار · مفيش نشر · مفيش دفع · مفيش موارد مدفوعة.
#
# 📌 ترتيب الـjobs (مرتّب على شكل سلسلة):
#    dependency-install → backend-suite → frontend-suite
#                      → workflow-definition-gates → hygiene-guards
#                      → data-integrity → release-gate
#    ⛔ أي فشل ⇒ الـpipeline كله بيقف.

on:
  push:
    branches:
      - main
      - 'ci/**'
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # ⛔ بصمة المرشح (الجولة ٢٦) — المصدر الواحد لكل النتائج ⭐
  #    (نفس الـSHA في كل الـjobs ⇒ كل نتيجة مربوطة بيه ⭐)
  OCTA_CANDIDATE_SHA: '540ec33d7932ea7e23b1d67262809b85ff424047'
  # ⭐⭐⭐ (R28) ⭐ بصمة **الواجهة** المعتمدة ⭐
  #    ⇒ ⭐ اختبار العقد بين المستودعين مربوط بالبصمتين ⭐
  OCTA_FE_SHA: 'cb83125d03833c2791cfd31771cc8d446230567e'

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  ⭐⭐⭐ (R28) ⭐ البوابات البديلة + عقد المستودعين ⭐⭐⭐
  #  📌 فصل صريح ⭐: ⭐ عدد الاختبارات الأصلية ⭐
  #     ⭐ **منفصل** ⭐ عن ⭐ عدد البوابات البديلة ⭐.
  #  📌 A5 ⭐ (الجولة ٢٨) ⭐: ⭐ تثبيت + بناء + اختبار تكامل ⭐
  #     ⭐ من الشجرة النظيفة للمرشح الحالي ⭐ (مش حزم الجولة ٢٣ ⭐).
  # ══════════════════════════════════════════════════════════════════════
  alternative-gates:
    name: "🚪 ٢) البوابات البديلة (A1..A5 ⭐) + عقد المستودعين ⭐"
    needs: dependency-install
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          DEF_SHA="$(git rev-parse HEAD)"
          echo "ci_def_sha=$DEF_SHA" >> "$GITHUB_ENV"
          echo "CI definition SHA = $DEF_SHA"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

      - name: "🔒 بوابة بصمة المرشح (merge-base --is-ancestor ⭐)"
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          # ⭐⭐⭐ (R29 · FINDING-18) ⭐⭐⭐ مطابقة **بالضبط** ⭐⭐⭐
          # 📌 السبب ⭐: ⛔ «سلف» ⭐ (ancestor ⭐) ⭐ بتسمح بأي commit أحدث ⭐
          #    ⇒ ⛔ الكود المقيس ممكن **مش** المرشح ⭐ ⇒ ⛔ كذب ⭐.
          # ✅ دلوقتي ⭐: ⛔ الـcheckout **مثبّت** ⭐ على SHA المرشّح ⭐
          #    ⇒ ⛔ لازم يطابق **بالضبط** ⭐ (من غيره ⇒ فشل ⭐).
          if [ "$ACTUAL" != "$OCTA_CANDIDATE_SHA" ]; then
            echo "FAIL: الـSHA المختبَر ($ACTUAL) ⭐ مش المرشح المطلوب ($OCTA_CANDIDATE_SHA)"
            exit 1
          fi
          echo "PASS: الـSHA المختبَر = المرشح بالضبط ⭐"

      - name: "🐍 تجهيز Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "📦 pip install -r requirements.txt (بوابة صارمة)"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: "🚪 البوابات البديلة (A1..A5 ⭐ — مفيش استبعاد صامت ⭐)"
        run: |
          set -euo pipefail
          python3 tools/test_ci_alt_gates.py --gate A1
          python3 tools/test_ci_alt_gates.py --gate A2
          python3 tools/test_ci_alt_gates.py --gate A3
          python3 tools/test_ci_alt_gates.py --gate A4
          python3 tools/test_ci_alt_gates.py --gate A5
          echo "✅ كل البوابات البديلة عدّت ⭐"

      - name: "📥 تحميل مستودع الواجهة عند البصمة المعتمدة ⭐"
        uses: actions/checkout@v4
        with:
          repository: ahmed3zz2020-source/octa
          ref: ${{ env.OCTA_FE_SHA }}
          path: fe
          fetch-depth: 0

      - name: "🔗 ⭐⭐⭐ (R28) ⭐ اختبار العقد بين المستودعين ⭐⭐⭐"
        run: |
          set -euo pipefail
          python3 tools/test_cross_repo_contract.py \
            --fe-root fe \
            --be-root . \
            --fe-sha "$OCTA_FE_SHA" \
            --be-sha "$OCTA_CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/octa-cross-repo.json"

  # ══════════════════════════════════════════════════════════════
  # ① البوابة الأولى: تثبيت الاعتماديات (صارم)
  # ══════════════════════════════════════════════════════════════
  dependency-install:
    name: "📦 ١) تثبيت الاعتماديات — بوابة صارمة"
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          DEF_SHA="$(git rev-parse HEAD)"
          echo "ci_def_sha=$DEF_SHA" >> "$GITHUB_ENV"
          echo "CI definition SHA = $DEF_SHA"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

      - name: "🔒 بوابة بصمة المرشح (merge-base --is-ancestor ⭐)"
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "ci_def_sha=${ci_def_sha:-unknown}"
          echo "tested_sha=$ACTUAL"
          echo "candidate_sha=$OCTA_CANDIDATE_SHA"
          echo "fe_sha=$OCTA_FE_SHA"
          echo "tested_head=$ACTUAL"
          # ⭐⭐⭐ (R29 · FINDING-18) ⭐⭐⭐ مطابقة **بالضبط** ⭐⭐⭐
          # 📌 السبب ⭐: ⛔ «سلف» ⭐ (ancestor ⭐) ⭐ بتسمح بأي commit أحدث ⭐
          #    ⇒ ⛔ الكود المقيس ممكن **مش** المرشح ⭐ ⇒ ⛔ كذب ⭐.
          # ✅ دلوقتي ⭐: ⛔ الـcheckout **مثبّت** ⭐ على SHA المرشّح ⭐
          #    ⇒ ⛔ لازم يطابق **بالضبط** ⭐ (من غيره ⇒ فشل ⭐).
          if [ "$ACTUAL" != "$OCTA_CANDIDATE_SHA" ]; then
            echo "FAIL: الـSHA المختبَر ($ACTUAL) ⭐ مش المرشح المطلوب ($OCTA_CANDIDATE_SHA)"
            exit 1
          fi
          echo "PASS: الـSHA المختبَر = المرشح بالضبط ⭐"

      - name: "🔒 البوابة الكاملة (نطاق الفرق = ملفات الـCI بس)"
        run: bash tools/ci_candidate_gate.sh

      - name: "🐍 تجهيز Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "📦 pip install -r requirements.txt (فشل التثبيت ⇒ فشل الـjob)"
        run: |
          set -euo pipefail
          echo "📦 تثبيت الاعتماديات من requirements.txt…"
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          echo "✅ التثبيت خلص بنجاح"

      - name: "🔬 تحقّق إن التثبيت تمّ فعلاً (إصدارات مثبّتة + pip check)"
        run: |
          set -euo pipefail
          python -m pip check
          python3 - <<'PY'
          import importlib
          import sys

          WANT = {}
          for line in open("requirements.txt", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name, _sep, ver = line.partition("==")
              WANT[name.strip().lower()] = ver.strip()

          MODS = {"flask": "flask", "requests": "requests", "gunicorn": "gunicorn"}
          bad = 0
          for dist, mod in MODS.items():
              m = importlib.import_module(mod)
              got = getattr(m, "__version__", None)
              want = WANT.get(dist, "")
              if want and got != want:
                  print("⛔ %s: متوقع %s · الموجود %s" % (dist, want, got))
                  bad += 1
              else:
                  print("✅ %s==%s اتثبّت فعلاً" % (dist, got))
          if bad:
              print("⛔ التثبيت مش مطابق لـ requirements.txt")
              sys.exit(1)
          print("✅ كل الاعتماديات مثبّتة بالنسخة المطلوبة")
          PY

      - name: "🛡️ حارس الـCI (لازم ملف الـCI نفسه نضيف)"
        run: python3 tools/test_ci_gates.py ci-workflow/octa-ci.yml

  # ══════════════════════════════════════════════════════════════
  # ② كل اختبارات الباك (كل ملف موجود — بلا استبعاد صامت)
  # ══════════════════════════════════════════════════════════════
  backend-suite:
    name: "🧪 ٢) اختبارات الباك — كل الملفات (تصنيف أربع حالات ⭐)"
    needs: dependency-install
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          DEF_SHA="$(git rev-parse HEAD)"
          echo "ci_def_sha=$DEF_SHA" >> "$GITHUB_ENV"
          echo "CI definition SHA = $DEF_SHA"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

      - name: "🔒 بوابة بصمة المرشح (merge-base --is-ancestor ⭐)"
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "ci_def_sha=${ci_def_sha:-unknown}"
          echo "tested_sha=$ACTUAL"
          echo "candidate_sha=$OCTA_CANDIDATE_SHA"
          echo "fe_sha=$OCTA_FE_SHA"
          echo "tested_head=$ACTUAL"
          # ⭐⭐⭐ (R29 · FINDING-18) ⭐⭐⭐ مطابقة **بالضبط** ⭐⭐⭐
          # 📌 السبب ⭐: ⛔ «سلف» ⭐ (ancestor ⭐) ⭐ بتسمح بأي commit أحدث ⭐
          #    ⇒ ⛔ الكود المقيس ممكن **مش** المرشح ⭐ ⇒ ⛔ كذب ⭐.
          # ✅ دلوقتي ⭐: ⛔ الـcheckout **مثبّت** ⭐ على SHA المرشّح ⭐
          #    ⇒ ⛔ لازم يطابق **بالضبط** ⭐ (من غيره ⇒ فشل ⭐).
          if [ "$ACTUAL" != "$OCTA_CANDIDATE_SHA" ]; then
            echo "FAIL: الـSHA المختبَر ($ACTUAL) ⭐ مش المرشح المطلوب ($OCTA_CANDIDATE_SHA)"
            exit 1
          fi
          echo "PASS: الـSHA المختبَر = المرشح بالضبط ⭐"

      - name: "🔒 البوابة الكاملة (نطاق الفرق = ملفات الـCI بس)"
        run: bash tools/ci_candidate_gate.sh

      - name: "🐍 تجهيز Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "📦 pip install -r requirements.txt (بوابة صارمة)"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: "🧪 تشغيل بيئة الـstaging المعزولة (لاختبارات الأمان الحقيقية)"
        run: |
          set -euo pipefail
          export STAGE_DIR="$RUNNER_TEMP/octa-staging"
          export STAGE_PORT=8099
          mkdir -p "$STAGE_DIR"
          # ⛔ مفيش تيليجرام في بيئة الـstaging:
          #    خيط تيليجرام بيعمل TLS من خيط تاني ⇒ OpenSSL مش آمن
          #    ⇒ كان السقوط بيقتل السيرفر كله. نمطّله يدوياً ⭐.
          export TELEGRAM_BOT_TOKEN=""
          export TELEGRAM_CHAT_ID=""
          # ⛔ مفيش مهام خلفية (تحديث الأسعار/الكاش) في بيئة الـstaging:
          #    ① بتعمل TLS من خيط تاني ⇒ نفس خطر السقوط ⭐
          #    ② بتجيب داتا حيّة غير ثابتة ⇒ الـCI يبقى غير حتمي ⭐
          #    البيانات الثابتة بتتبعت من ملفات المستودع ✓
          export OCTA_BG_TASKS="off"
          ( while true; do
              python tools/staging/run_staging.py >> "$RUNNER_TEMP/staging.log" 2>&1
              echo "⚠️  الـstaging وقف — بيرجع تاني" >&2
              sleep 2
            done ) &
          for _i in $(seq 1 90); do
            if curl -s -m 2 -o /dev/null "http://127.0.0.1:8099/api/health"; then break; fi
            sleep 2
          done
          if ! curl -s -m 5 -o /dev/null "http://127.0.0.1:8099/api/health"; then
            echo "⛔ بيئة الـstaging مش راقية"
            tail -n 60 "$RUNNER_TEMP/staging.log"
            exit 1
          fi
          echo "✅ الـstaging شغّال على 127.0.0.1:8099 (بيانات وهمية ١٠٠٪)"
          # ⛔ توكن الأدمن ⭐ — اختبارات الأمان محتاجاه ⭐
          #    (من غيره ⇒ mint_session بيرجّع 401 ⭐ ⇒ فشل وهمي ⭐)
          echo "STAGE_ADMIN_TOKEN=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['admin_token'])" "$STAGE_DIR/staging-config.json")" >> "$GITHUB_ENV"
          echo "🔒 توكن الأدمن اتسجّل للخطوات الجاية ⭐"

      - name: "🔒 تثبيت البيانات المرجعية (قبل الجولة) ⭐"
        env:
          OCTA_DATA_BEFORE: "${{ runner.temp }}/octa-data-before.sha256"
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/octa-ci-data"
          # ⛔⛔⛔ نسخة من البيانات المرجعية ⭐
          #    الاختبارات بتشتغل على نسخة ⭐ ⇒ مستحيل تكتسّح data/ ⭐
          #    (وبتبقى البيانات الأساسية متاحة للاختبارات ⭐)
          cp -r data/. "${{ runner.temp }}/octa-ci-data/"
          find data -maxdepth 1 -name '*.json' -type f -print0 \
            | xargs -0 sha256sum > "${{ runner.temp }}/octa-data-before.sha256"
          echo "OCTA_DATA_BEFORE=${{ runner.temp }}/octa-data-before.sha256" >> "$GITHUB_ENV"
          echo "🔒 بصمات البيانات المرجعية اتسجّلت: $(wc -l < "${{ runner.temp }}/octa-data-before.sha256") ملف ⭐"

      - name: "🔄 تصفير البيئة قبل كل ملف (حالة نظيفة ⭐)"
        run: chmod +x tools/ci_reset_staging.sh

      - name: "🧭 تنفيذ الاختبارات الحقيقية (الباك: كل test_*.py في الجذر و tools/) ⭐"
        env:
          STAGE_URL: "http://127.0.0.1:8099"
          STAGE_CONFIG: "${{ runner.temp }}/octa-staging/staging-config.json"
          # 🛡️ أي كتابة على البيانات المرجعية تروح لمجلد مؤقّت ⭐
          OCTA_DATA_DIR: "${{ runner.temp }}/octa-ci-data"
        run: |
          set -euo pipefail
          # ⛔ المُصنِّف: أربع حالات صريحة ⭐
          #    (passed · failed · skipped · blocked) ⭐
          #    ⛔ أي skipped/blocked ⇒ الملف فاشل ⇒ الـjob بيفشل ⭐
          python3 tools/ci_result_classifier.py run \
            --kind python \
            --root . \
            --out "$RUNNER_TEMP/octa-backend-results.json" \
            --timeout 2400 \
            --reset-cmd "bash tools/ci_reset_staging.sh" \
            --last test_signup_flow.py

      - name: "🔓 التحقق من البيانات المرجعية (بعد الجولة) ⭐"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys

          before = {}
          with open(os.environ["OCTA_DATA_BEFORE"], encoding="utf-8") as fh:
              for line in fh:
                  digest, _, path = line.strip().partition("  ")
                  if path:
                      before[path] = digest
          changed = []
          for path, digest in sorted(before.items()):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(65536), b""):
                      h.update(chunk)
              if h.hexdigest() != digest:
                  changed.append(path)
          if changed:
              print("⛔⛔⛔ البيانات المرجعية اتغيرت أثناء الجولة ⭐:")
              for p in changed:
                  print("   - %s" % p)
              print("⛔ بنرجّع الملفات لأصلها ⭐ (والـjob بيفشل ⭐ ⇒ النتيجة ما تنفعش تتقرأ ⭐)")
              subprocess.run(["git", "checkout", "--", "data/"], check=False)
              sys.exit(1)
          print("✅ البيانات المرجعية ما اتغيرتش ⭐ (الجولة حتمية ⭐)")
          PY

  # ══════════════════════════════════════════════════════════════
  # ③ عقد الواجهة + تعريف الـCI بتاع الواجهة
  # ══════════════════════════════════════════════════════════════
  frontend-suite:
    name: "🖥️ ٣) عقد الواجهة + تعريف الـCI بتاع الواجهة"
    needs: dependency-install
    runs-on: ubuntu-latest
    steps:
      - name: "🧾 بصمة تعريف الـCI (⭐ commit ملف الـworkflow ⭐)"
        run: |
          set -euo pipefail
          DEF_SHA="$(git rev-parse HEAD)"
          echo "ci_def_sha=$DEF_SHA" >> "$GITHUB_ENV"
          echo "CI definition SHA = $DEF_SHA"

      - name: "📥 تحميل كود المنتج على SHA المرشّح ⭐ (مثبّت ⭐)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.OCTA_CANDIDATE_SHA }}

